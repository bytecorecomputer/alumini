<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f2a43">
<title>Bytecore · My Fees</title>
<style>
:root{--ink:#0f2a43;--muted:#5b6b7b;--line:#dfe5ea;--bg:#f3f6f8;--card:#fff;--paid:#17794d;--due:#b4540a;--brand:#0e6f8a}
@media(prefers-color-scheme:dark){:root{--ink:#e8eef3;--muted:#93a4b3;--line:#27384a;--bg:#0b1722;--card:#132434;--paid:#4cc38a;--due:#f0a05a;--brand:#5cc3df}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:520px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px 40px}
h1{font-size:1.5rem;margin:28px 0 4px}p{margin:0}.muted{color:var(--muted)}.sm{font-size:.875rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
label{display:block;font-weight:600;margin-bottom:6px}
input{width:100%;font:inherit;padding:14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid var(--brand);outline-offset:1px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:14px 18px;background:var(--brand);color:#fff;cursor:pointer;width:100%;margin-top:12px}
button.ghost{background:none;color:var(--brand);border:1.5px solid var(--line);width:auto;margin:0;padding:10px 14px}
button:disabled{opacity:.6}.err{color:var(--due);margin-top:10px;font-weight:600}
.pick{display:block;text-align:left;background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.big{font-size:2.4rem;font-weight:700;line-height:1.1;margin:4px 0 14px}
.bar{height:12px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--paid)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stats b{display:block;font-size:1.05rem}
table{width:100%;border-collapse:collapse;margin-top:6px}th,td{padding:10px 4px;border-bottom:1px solid var(--line);text-align:right;font-size:.92rem}
th{font-weight:600;color:var(--muted);font-size:.8rem}th:first-child,td:first-child{text-align:left}
.row{display:flex;gap:10px;justify-content:space-between;margin-top:18px}.paid{color:var(--paid)}.due{color:var(--due)}
</style></head><body><main id="app"></main>
<script>
const $=document.getElementById('app'),K='bc_token';
const inr=n=>'₹'+Number(n).toLocaleString('en-IN');
const dt=d=>d?new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(opts){const r=await fetch('/api/portal',opts);const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'Something went wrong.'),{status:r.status});return j}

function login(msg=''){
  $.innerHTML=`<h1>Check your fees</h1><p class="muted">Enter your roll number or your registered mobile number.</p>
  <form class="card" id="f"><label for="q">Roll number or mobile number</label>
  <input id="q" name="q" autocomplete="off" inputmode="text" autofocus placeholder="e.g. 1042 or 98XXXXXXXX">
  <button>View my fees</button><p class="err" role="alert">${esc(msg)}</p></form>`;
  f.onsubmit=async e=>{e.preventDefault();const q=f.q.value.trim();if(!q)return;const b=f.querySelector('button');b.disabled=true;b.textContent='Checking…';
    try{submit(q)}catch{}};
}
async function submit(q,id){
  try{const j=await api({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q,id})});
    if(j.choices)return choose(q,j.choices);
    localStorage.setItem(K,j.token);ledger(j.student)}
  catch(e){login(e.message)}
}
function choose(q,list){
  $.innerHTML=`<h1>Who are you?</h1><p class="muted">More than one student uses this number.</p>`+
  list.map((s,i)=>`<button class="pick" data-i="${i}">${esc(s.name)}<br><span class="muted sm">${esc(s.course)}</span></button>`).join('')+
  `<div class="row"><button class="ghost" id="back">Back</button></div>`;
  $.querySelectorAll('.pick').forEach(b=>b.onclick=()=>submit(q,list[b.dataset.i].id));back.onclick=()=>login();
}
function ledger(s){
  const pct=s.total?Math.min(100,Math.round(s.paid/s.total*100)):0;let bal=s.total;
  const pays=[...s.payments].sort((a,b)=>(a.date||'~').localeCompare(b.date||'~'));
  const rows=pays.map((p,i)=>{bal=Math.max(0,bal-p.amount);return`<tr><td>${dt(p.date)}${p.receipt?`<br><span class="muted sm">Receipt ${esc(p.receipt)}</span>`:''}</td><td class="paid">${inr(p.amount)}</td><td>${inr(bal)}</td></tr>`}).join('');
  $.innerHTML=`<h1>${esc(s.name)}</h1><p class="muted">${esc(s.course)} · ${esc(s.centre)} · Roll ${esc(s.roll)}</p>
  <section class="card"><p class="muted sm">${s.due?'Balance to pay':'Fees status'}</p>
  <p class="big ${s.due?'due':'paid'}">${s.total?(s.due?inr(s.due):'All paid'):'Not set'}</p>
  <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
  <div class="stats"><div><span class="muted sm">Total fee</span><b>${inr(s.total)}</b></div><div><span class="muted sm">Paid</span><b class="paid">${inr(s.paid)}</b></div>
  <div><span class="muted sm">Registration</span><b>${inr(s.regFee)}</b></div></div>
  ${s.total?'':'<p class="muted sm" style="margin-top:12px">Your total fee is not entered yet. Please ask your centre.</p>'}</section>
  <section class="card"><b>Installments paid</b>${rows?`<table><thead><tr><th>Date</th><th>Amount</th><th>Balance</th></tr></thead><tbody>${rows}</tbody></table>`:'<p class="muted" style="margin-top:8px">No installments recorded yet.</p>'}</section>
  <div class="row"><button class="ghost" id="rf">Refresh</button><button class="ghost" id="lo">Log out</button></div>
  <p class="muted sm" style="margin-top:16px">Figures come from your centre's fee register. If something looks wrong, show your receipt at the centre.</p>`;
  lo.onclick=()=>{localStorage.removeItem(K);login()};rf.onclick=()=>boot();
}
async function boot(){
  const t=localStorage.getItem(K);if(!t)return login();
  try{ledger((await api({headers:{Authorization:'Bearer '+t}})).student)}
  catch(e){if(e.status===401)localStorage.removeItem(K);login(e.status===401?'':e.message)}
}
boot();
</script></body></html>
